<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Nearby Farm Discovery Map – FARMLINK</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#16834A" />

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/components.css" />

  <style>
    .map-container-wrap {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.5rem;
      height: calc(100vh - 160px);
      min-height: 600px;
    }
    @media (min-width: 1024px) {
      .map-container-wrap {
        grid-template-columns: 380px 1fr;
      }
    }
    #interactive-leaflet-map {
      width: 100%;
      height: 100%;
      min-height: 480px;
      border-radius: var(--fl-radius-xl);
      border: 1px solid var(--fl-border);
      box-shadow: var(--fl-shadow-sm);
      z-index: 10;
    }
    .farm-list-panel {
      overflow-y: auto;
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      padding-right: 4px;
    }
    .farm-map-card {
      background: #FFFFFF;
      border-radius: var(--fl-radius-lg);
      border: 1px solid var(--fl-border);
      padding: 1.15rem;
      cursor: pointer;
      transition: all var(--fl-transition-smooth);
    }
    .farm-map-card:hover, .farm-map-card.active {
      border-color: var(--fl-primary);
      box-shadow: 0 4px 16px rgba(22, 131, 74, 0.15);
      transform: translateY(-2px);
    }
    .leaflet-popup-content-wrapper {
      border-radius: 16px !important;
      padding: 4px !important;
      box-shadow: var(--fl-shadow-float) !important;
    }
  </style>
</head>
<body>

  <!-- Top Navbar -->
  <header class="fl-navbar">
    <div class="fl-nav-container">
      <a href="index.html" class="fl-logo">
        <div class="fl-logo-icon">
          <i class="bi bi-flower1"></i>
        </div>
        <span>FARMLINK</span>
      </a>

      <ul class="fl-nav-links">
        <li><a href="index.html" class="fl-nav-link">Home</a></li>
        <li><a href="marketplace.html" class="fl-nav-link">Explore Products</a></li>
        <li><a href="farms-map.html" class="fl-nav-link active">Nearby Farms</a></li>
        <li><a href="traceability.html" class="fl-nav-link">Traceability QR</a></li>
      </ul>

      <div class="fl-nav-actions">
        <a href="#" class="fl-btn-icon open-cart-btn" title="Shopping Cart">
          <i class="bi bi-cart3"></i>
          <span class="fl-badge-count cart-badge-count" style="display:none;">0</span>
        </a>
        <a href="marketplace.html" class="fl-btn fl-btn-primary fl-btn-sm">
          Wholesale Store
        </a>
      </div>
    </div>
  </header>

  <!-- Main Map & Farm Discovery -->
  <div class="fl-container" style="padding-top: 1.25rem; padding-bottom: 1.25rem;">
    
    <!-- Controls Header -->
    <div style="background: #FFFFFF; border-radius: var(--fl-radius-xl); border: 1px solid var(--fl-border); padding: 1.25rem 1.5rem; margin-bottom: 1.25rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
      <div>
        <h1 style="font-size: 1.5rem; font-weight: 800; color: var(--fl-primary-dark); line-height: 1.2;">
          West Java Farm Discovery Map
        </h1>
        <p style="font-size: 0.85rem; color: var(--fl-text-secondary); margin-top: 0.15rem;">
          Verified agricultural clusters in Lembang, Pangalengan, Cianjur, Sukabumi & Subang.
        </p>
      </div>

      <!-- Distance Radius Slider & Method Filter -->
      <div style="display: flex; gap: 1rem; align-items: center; flex-wrap: wrap;">
        <div style="display: flex; align-items: center; gap: 0.5rem; font-size: 0.85rem; background: var(--fl-bg); padding: 0.4rem 0.85rem; border-radius: var(--fl-radius-pill); border: 1px solid var(--fl-border);">
          <span style="font-weight: 600; color: var(--fl-text-secondary);">Radius:</span>
          <input type="range" id="radius-slider" min="15" max="120" value="80" style="width: 100px; accent-color: var(--fl-primary);" oninput="updateRadius(this.value)" />
          <span id="radius-val" style="font-weight: 700; color: var(--fl-primary-dark);">80 km</span>
        </div>

        <select id="map-method-filter" class="fl-select" style="width: auto; padding: 0.45rem 1rem; border-radius: var(--fl-radius-pill); font-size: 0.85rem;" onchange="filterMapFarms()">
          <option value="all">All Farming Methods</option>
          <option value="Organic">Organic Certified</option>
          <option value="Pesticide-Free">Pesticide-Free</option>
          <option value="Standard Farming">Standard GAP</option>
        </select>
      </div>
    </div>

    <!-- Map & Side List Split -->
    <div class="map-container-wrap">
      
      <!-- Side List of Nearby Farms -->
      <div class="farm-list-panel" id="farm-cards-list">
        <!-- Rendered dynamically -->
      </div>

      <!-- Leaflet Map Canvas -->
      <div style="position: relative;">
        <div id="interactive-leaflet-map"></div>

        <!-- Floating Map Legend -->
        <div style="position: absolute; bottom: 20px; left: 20px; z-index: 1000; background: rgba(255, 255, 255, 0.92); backdrop-filter: blur(10px); padding: 0.65rem 1rem; border-radius: var(--fl-radius-md); box-shadow: var(--fl-shadow-md); border: 1px solid var(--fl-border); font-size: 0.75rem; display: flex; gap: 0.85rem; align-items: center;">
          <span style="display: flex; align-items: center; gap: 0.35rem;">
            <span style="width: 10px; height: 10px; border-radius: 50%; background: #16834A;"></span> Verified Organic
          </span>
          <span style="display: flex; align-items: center; gap: 0.35rem;">
            <span style="width: 10px; height: 10px; border-radius: 50%; background: #0284C7;"></span> Pesticide-Free
          </span>
        </div>
      </div>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Store & App -->
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>

  <script>
    let map = null;
    let markers = [];
    let currentRadius = 80;

    // Buyer reference location: Dago, Bandung (-6.8924, 107.6171)
    const BUYER_LOC = [-6.8924, 107.6171];

    document.addEventListener('DOMContentLoaded', () => {
      initMap();
      renderFarmsOnMap();
    });

    function initMap() {
      // Center map around Bandung & West Java agricultural highlands
      map = L.map('interactive-leaflet-map').setView([-6.85, 107.5], 9);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 18,
        attribution: '&copy; <a href="https://openstreetmap.org/copyright">OpenStreetMap</a> contributors'
      }).addTo(map);

      // Add Buyer Location Pin (Resto Nusantara Gourmet)
      const buyerIcon = L.divIcon({
        className: 'custom-buyer-pin',
        html: `<div style="background:#18251D; color:#FFF; width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; border:3px solid #FFF; box-shadow:0 3px 8px rgba(0,0,0,0.3);"><i class="bi bi-geo-fill"></i></div>`,
        iconSize: [34, 34],
        iconAnchor: [17, 17]
      });

      L.marker(BUYER_LOC, { icon: buyerIcon })
        .addTo(map)
        .bindPopup("<strong>Your Kitchen / Business Location</strong><br />Resto Nusantara Gourmet, Dago Bandung");
    }

    function calculateDistanceKm(lat1, lon1, lat2, lon2) {
      const R = 6371; // Earth radius in km
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = 
        Math.sin(dLat/2) * Math.sin(dLat/2) +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
        Math.sin(dLon/2) * Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return Math.round(R * c);
    }

    function renderFarmsOnMap() {
      // Clear existing markers
      markers.forEach(m => map.removeLayer(m));
      markers = [];

      const methodFilter = document.getElementById('map-method-filter').value;
      const farmers = window.store.getFarmers();
      const listContainer = document.getElementById('farm-cards-list');
      listContainer.innerHTML = '';

      farmers.forEach((farmer, idx) => {
        const [lat, lng] = farmer.coordinates;
        const distance = calculateDistanceKm(BUYER_LOC[0], BUYER_LOC[1], lat, lng);

        // Filter by radius & method
        if (distance > currentRadius) return;
        if (methodFilter !== 'all' && farmer.farmingMethod !== methodFilter) return;

        // Custom Farm Marker Pin
        const pinColor = farmer.farmingMethod === 'Organic' ? '#16834A' : '#0284C7';
        const customIcon = L.divIcon({
          className: 'custom-farm-marker',
          html: `
            <div style="background:${pinColor}; color:#fff; width:38px; height:38px; border-radius:50% 50% 50% 0; transform:rotate(-45deg); display:flex; align-items:center; justify-content:center; border:3px solid #FFF; box-shadow:0 4px 10px rgba(0,0,0,0.25);">
              <i class="bi bi-tree" style="transform:rotate(45deg); font-size:1.1rem;"></i>
            </div>
          `,
          iconSize: [38, 38],
          iconAnchor: [19, 38]
        });

        const popupContent = `
          <div style="font-family:-apple-system, sans-serif; width:220px; padding:4px;">
            <img src="${farmer.coverImage}" style="width:100%; height:85px; object-fit:cover; border-radius:10px; margin-bottom:8px;" />
            <div style="font-weight:800; font-size:1rem; color:#18251D;">${farmer.farmName}</div>
            <div style="font-size:0.8rem; color:#16834A; font-weight:600; margin-bottom:4px;">${farmer.name} • ${distance} km away</div>
            <div style="font-size:0.75rem; color:#64748B; margin-bottom:8px;">${farmer.specialties.join(', ')}</div>
            <a href="farmer-profile.html?id=${farmer.id}" class="fl-btn fl-btn-primary fl-btn-sm" style="width:100%; text-align:center; padding:0.35rem 0.5rem; font-size:0.8rem;">
              View Farm & Crops
            </a>
          </div>
        `;

        const marker = L.marker([lat, lng], { icon: customIcon })
          .addTo(map)
          .bindPopup(popupContent);

        markers.push(marker);

        // Build side list card
        const card = document.createElement('div');
        card.className = 'farm-map-card';
        card.id = `card-farm-${farmer.id}`;
        card.innerHTML = `
          <div style="display:flex; gap:0.75rem;">
            <img src="${farmer.avatar}" alt="${farmer.name}" style="width:52px; height:52px; border-radius:50%; object-fit:cover; border:2px solid var(--fl-primary);" />
            <div style="flex:1;">
              <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                <h4 style="font-size:0.95rem; font-weight:700; color:var(--fl-text);">${farmer.farmName}</h4>
                <span style="font-size:0.75rem; font-weight:700; color:var(--fl-primary);">${distance} km</span>
              </div>
              <div style="font-size:0.8rem; color:var(--fl-text-secondary);">${farmer.name} • ${farmer.location.split(',')[0]}</div>
              <div style="display:flex; gap:0.35rem; margin-top:0.4rem; flex-wrap:wrap;">
                <span class="fl-badge ${farmer.farmingMethod === 'Organic' ? 'fl-badge-organic' : 'fl-badge-pesticide-free'}" style="font-size:0.7rem; padding:0.15rem 0.5rem;">
                  ${farmer.farmingMethod}
                </span>
                <span style="font-size:0.75rem; color:var(--fl-text-muted);">⭐ ${farmer.rating}</span>
              </div>
            </div>
          </div>
          <div style="margin-top:0.75rem; padding-top:0.5rem; border-top:1px dashed var(--fl-border); font-size:0.775rem; color:var(--fl-text-secondary); display:flex; justify-content:space-between; align-items:center;">
            <span>${farmer.specialties.slice(0, 2).join(' • ')}</span>
            <a href="farmer-profile.html?id=${farmer.id}" style="color:var(--fl-primary); font-weight:700;">Open Profile →</a>
          </div>
        `;

        card.onclick = () => {
          map.flyTo([lat, lng], 12, { animate: true, duration: 1.2 });
          marker.openPopup();
          document.querySelectorAll('.farm-map-card').forEach(c => c.classList.remove('active'));
          card.classList.add('active');
        };

        listContainer.appendChild(card);
      });
    }

    function updateRadius(val) {
      currentRadius = parseInt(val);
      document.getElementById('radius-val').textContent = `${val} km`;
      renderFarmsOnMap();
    }

    function filterMapFarms() {
      renderFarmsOnMap();
    }
  </script>
</body>
</html>
